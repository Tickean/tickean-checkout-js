<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tickean Elements — wizard demo</title>
    <meta
      name="description"
      content="Mock interactivo del checkout Tickean Elements (modo demo, sin backend)."
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --ink: #0f172a;
        --muted: #64748b;
        --card: #ffffff;
        --line: #e2e8f0;
        --accent: #0f766e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }
      body.embed {
        background: transparent;
      }
      .shell {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px 40px;
      }
      body.embed .shell {
        max-width: none;
        padding: 8px;
      }
      .banner {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 16px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
      }
      body.embed .banner {
        margin-bottom: 8px;
        padding: 8px 10px;
        font-size: 13px;
      }
      .banner h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }
      .banner p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #ecfdf5;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
      }
      .stage {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        padding: 8px;
        min-height: 520px;
        overflow: auto;
      }
      body.embed .stage {
        border: none;
        border-radius: 12px;
        min-height: 560px;
        padding: 0;
        background: transparent;
      }
      .hint {
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }
      body.embed .hint {
        margin-top: 8px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@tickean/checkout-js": "https://cdn.jsdelivr.net/npm/@tickean/checkout-js@0.2.12/dist/index.mjs",
          "@tickean/checkout-elements": "https://cdn.jsdelivr.net/npm/@tickean/checkout-elements@0.2.23/dist/index.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div class="shell">
      <div class="banner" id="banner">
        <div>
          <h1>Wizard Tickean Elements</h1>
          <p>
            Mock interactivo · OTP <code>123456</code> · sin API real
          </p>
        </div>
        <span class="badge">demo mode</span>
      </div>
      <div class="stage">
        <tickean-checkout
          publishable-key="pk_test_demo"
          event-slug="demo-festival"
          demo
          locale="es-AR"
          appearance="flat"
          layout="steps"
          payment-method="TRANSFER"
          currency="ARS"
        ></tickean-checkout>
      </div>
      <p class="hint" id="hint">
        Probá el flujo: entradas → tus datos → OTP <code>123456</code> → pago
        por transferencia. Este embed usa
        <code>@tickean/checkout-js@0.2.12</code> +
        <code>@tickean/checkout-elements@0.2.23</code>.
      </p>
    </div>
    <script type="module">
      import "@tickean/checkout-elements";

      const params = new URLSearchParams(window.location.search);
      if (params.get("embed") === "1") {
        document.body.classList.add("embed");
      }
    </script>
  </body>
</html>
