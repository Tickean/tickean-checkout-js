name: Release (prepared, not auto-published)

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Changesets status
        run: npx changeset status || true
      - name: Publish placeholder
        run: |
          echo "Publishing is intentionally disabled for local-only delivery."
          echo "When ready: npx changeset publish"
