name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Playwright demo smoke
        working-directory: examples/nextjs-custom-checkout
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
